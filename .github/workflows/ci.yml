name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corehub
          POSTGRES_PASSWORD: corehub_dev_password
          POSTGRES_DB: corehub_iam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corehub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Prisma 7 resolves env("DATABASE_URL") when loading prisma.config.ts —
    # even `prisma generate` fails without it. A single URL serves every package.
    # The JWT/Bancard vars are required by the api-iam config the e2e test loads
    # (keys are generated in a step below; the secret is a throwaway CI value).
    env:
      DATABASE_URL: postgresql://corehub:corehub_dev_password@localhost:5432/corehub_iam
      JWT_PRIVATE_KEY_PATH: ./keys/private.pem
      JWT_PUBLIC_KEY_PATH: ./keys/public.pem
      JWT_ACTIVE_KID: ci-key
      BANCARD_WEBHOOK_SECRET: ci-webhook-secret-0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # The api-iam e2e test loads the real config, which requires JWT signing
      # keys at JWT_PRIVATE_KEY_PATH/JWT_PUBLIC_KEY_PATH (relative to apps/api-iam).
      - name: Generate JWT dev keys for api-iam
        run: pnpm --filter @corehub/api-iam exec tsx src/scripts/generate-dev-keys.ts

      # Apply the IAM schema so database-backed tests have their tables.
      - name: Apply database migrations
        run: pnpm --filter @corehub/api-iam exec prisma migrate deploy

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
